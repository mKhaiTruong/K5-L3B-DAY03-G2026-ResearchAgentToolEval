# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hãy đặt MỘT câu hỏi làm rõ và chờ phản hồi. Sử dụng khi thiếu thông tin cần thiết, hoặc khi cần xác nhận trước khi thực hiện thao tác. Không áp dụng nếu yêu cầu ban đầu đã đủ thông tin. Luôn đặt response_type tường minh: 'text' cho câu hỏi mở, 'yes_no' khi xin xác nhận, 'choice' khi có options."
    parameters:
      type: object
      properties:

        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Bắt buộc đặt rõ ràng: text cho câu hỏi mở, yes_no khi xin xác nhận, choice khi có options (always pass explicitly)"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question, response_type]

  - name: timeline
    description: "Các bài đăng gần đây từ tài khoản X/Twitter mà người dùng đã nêu tên. Tên tài khoản (screenname) là tên người dùng không bao gồm ký tự '@' (ví dụ: Sam Altman -> sama, Elon Musk -> elonmusk); tuyệt đối không tự đoán tên tài khoản – hãy yêu cầu làm rõ nếu cần. 'limit' là số lượng bài đăng mà người dùng yêu cầu (mặc định là 5)."
    parameters:
      type: object
      properties:

        screenname: {type: string, default: "", description: "Tên tài khoản, không có ký tự '@' (handle without @)"}
        limit: {type: integer, default: 5, description: "Số lượng"}
        screenname: { type: string, default: "", description: "Tên tài khoản" }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm bài đăng trên X theo chủ đề hoặc từ khóa. Sử dụng khi người dùng muốn biết mọi người đang nói gì về một chủ đề. `query` = chỉ từ khóa. `search_type` = 'Top' cho bài đăng phổ biến/viral', 'Latest' cho bài đăng mới nhất. `limit` = số lượng. "
    parameters:
      type: object
      properties:

        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Top' cho bài phổ biến/viral, 'Latest' cho bài mới nhất (Top for popular, Latest for newest)"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: >
      Search the internet for general information or news.
      Use topic="news" for news searches and topic="general"
      for other searches.
      For news searches, query must contain only the subject,
      without adding the word "news".
      Examples:
      - AI news today: query="AI", topic="news", timeframe="day".
      Do not use this tool to search social media posts;
      use social_search instead.
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        topic: { type: string, enum: [general, news], default: "general", description: "Phân loại" }
        timeframe: { type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian" }
        max_results: { type: integer, default: 5, description: "Số kết quả" }
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ MỘT đường dẫn (URL) cụ thể mà người dùng đã cung cấp (trong lượt này hoặc lượt trước đó). Tuyệt đối không tự bịa ra hoặc đoán đường dẫn – thay vào đó, hãy yêu cầu làm rõ."
    parameters:
      type: object
      properties:
        url: { type: string, default: "", description: "Địa chỉ" }
      required: [url]

  - name: format
    description: "Chuyển đổi các mục bạn đã thu thập thành một bản tóm tắt định dạng Markdown. Chỉ sử dụng sau khi các thao tác lookup/social_search/fetch đã trả về kết quả; tuyệt đối không dùng cho mục đích tìm kiếm."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              source: { type: string }
              summary: { type: string }
              section: { type: string }
        template: { type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn" }
        headline: { type: string, default: "", description: "Tiêu đề" }
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi tin nhắn đến kênh Telegram của nhóm. Chỉ thực hiện lệnh `send` sau khi người dùng đã xác nhận rõ ràng trong lượt tương tác trước đó (với tham số `confirmed=true`). Nếu người dùng yêu cầu đăng/gửi/xuất bản nội dung mà chưa có xác nhận từ trước, tuyệt đối không gọi lệnh `send` — thay vào đó, hãy gọi lệnh `clarify` với tham số `response_type='yes_no'`. Không bao giờ sử dụng lệnh `send` để trả lời câu hỏi hoặc hiển thị bản tóm tắt."
    parameters:
      type: object
      properties:

        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận: chỉ true sau khi người dùng đã xác nhận ở lượt trước (true only after the user confirmed in an earlier turn)"}

        text: { type: string, default: "", description: "Nội dung" }
        confirmed: { type: boolean, default: false, description: "Cờ xác nhận" }
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu policy nội bộ của công ty (source citation, data privacy, external publishing, tool usage). Dùng khi người dùng hỏi về quy định/quy trình nội bộ; KHÔNG dùng cho tin tức công khai trên web — dùng lookup."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        policy_area:
          { type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm" }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv. Dùng khi người dùng cần paper/preprint/nghiên cứu học thuật; KHÔNG dùng cho tin tức chung — dùng lookup."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        max_results: { type: integer, default: 5, description: "Số lượng" }
        sort_by: { type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp" }
      required: [query]

  - name: paper_text
    description: "Tải PDF của một paper arXiv và trích plain text. Dùng sau khi đã có arXiv id/URL (từ papers hoặc user đưa); KHÔNG dùng để tìm paper — dùng papers."
    parameters:
      type: object
      properties:
        arxiv_url: { type: string, default: "", description: "ID hoặc địa chỉ" }
        max_pages: { type: integer, default: 5, description: "Số trang" }
        max_chars: { type: integer, default: 8000, description: "Số ký tự" }
      required: [arxiv_url]
      
  - name: wiki
    description: "Tra cứu nền tảng bách khoa về MỘT thực thể cụ thể (người, tổ chức, sản phẩm, khái niệm) từ Wikipedia, trả tóm tắt ngắn + URL trang gốc. Dùng khi người dùng hỏi 'X là gì/là ai', cần 1-2 câu bối cảnh trước khi tìm tin, hoặc cần chuẩn hóa tên thực thể. KHÔNG dùng cho tin mới (dùng lookup với topic=news), bài đăng cộng đồng (dùng social_search), paper (dùng papers), hoặc khi chưa rõ thực thể (dùng clarify)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên thực thể cụ thể, ví dụ 'OpenAI' (không phải cả câu hỏi dài)"}
        lang: {type: string, enum: [en, vi], default: "en", description: "Ngôn ngữ Wikipedia: 'en' hoặc 'vi' (mặc định en)"}
        sentences: {type: integer, default: 3, description: "Số câu tóm tắt, 1-10 (mặc định 3)"}
      required: [query]

  - name: hackernews
    description: "Xem bài đăng và thảo luận công nghệ trên Hacker News, kèm điểm (points) và số bình luận (comments) làm tín hiệu cộng đồng. Dùng khi người dùng nói rõ Hacker News/HN, hỏi 'dân dev bàn gì', 'Show HN', hoặc cần thêm nguồn cộng đồng kỹ thuật bên cạnh X. KHÔNG dùng cho tin báo chí/web nói chung (dùng lookup), tweet trên X (dùng social_search), paper (dùng papers), hay đọc một URL cụ thể (dùng fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa, ví dụ 'AI agents' (không phải cả câu hỏi dài)"}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "'relevance' = liên quan nhất, 'date' = mới nhất"}
        limit: {type: integer, default: 5, description: "Số bài, 1-20 (mặc định 5)"}
      required: [query]
  - name: date_calc
    description: >
      Calculate dates accurately using date arithmetic.
      Use when the user asks for the number of days between dates,
      a date after or before a given number of days, today's date,
      or the weekday of a specific date.
      Do not use for general questions about holidays, calendars,
      or cultural events.
      Supported operations: today, diff_days, add_days, weekday.
      Dates must use YYYY-MM-DD format.
      For diff_days, return date2 minus date1.
      For add_days, provide date1 and integer days.
    parameters:
      type: object
      properties:
        op:
          type: string
          enum: [today, diff_days, add_days, weekday]
          description: Operation to perform
        date1:
          type: string
          description: >
            First date in YYYY-MM-DD format, or "today" to represent
            the current date.
        date2:
          type: string
          description: >
            Second date in YYYY-MM-DD format, or "today" to represent
            the current date. Used for diff_days.
        days:
          type: integer
          description: Number of days to add, for add_days
      required: [op]

  - name: cite_format
    description: >
      Format publication metadata into an APA 7 citation.
      Use when the user explicitly asks to create, format, or convert
      a reference or citation into APA style.
      Do not use for general questions about citation styles,
      such as asking what APA means.
      Only APA style is supported.
      Authors must be provided as a list in "Last, First" format.
      Missing year is represented as (n.d.).
      Missing URL is omitted.
    parameters:
      type: object
      properties:
        title:
          type: string
          description: Publication title
        authors:
          type: array
          items:
            type: string
          description: Authors in "Last, First" format
        year:
          type: integer
          description: Publication year, optional
        url:
          type: string
          description: Publication URL, optional
        style:
          type: string
          enum: [apa]
          description: Citation style. Only APA is supported.
      required: [title, authors]
  - name: extract_claims
    description: "Tách các claim không rỗng từ items nghiên cứu đã có và giữ source/URL; không dùng để tìm hoặc xác minh nguồn."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập, mỗi item có summary hoặc claim và có thể có source/url."
          items: {type: object}
      required: [items]

  - name: deduplicate_items
    description: "Loại item nghiên cứu trùng theo URL hoặc title, giữ lần xuất hiện đầu tiên; không dùng để fetch, gộp hoặc xếp hạng."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item nghiên cứu."
          items: {type: object}
        key: {type: string, enum: [url, title], default: "url", description: "Trường dùng để nhận diện trùng lặp."}
      required: [items]
